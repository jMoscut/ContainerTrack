name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ejecutar tests unitarios
        run: ./mvnw -B test
        # Si falla -> job falla -> no se despliega (Gate 1)

      - name: Generar reporte de cobertura (JaCoCo)
        if: always()
        run: ./mvnw -B jacoco:report

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: Build JAR
        run: ./mvnw -B package -DskipTests

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy a Railway
        # Se corre desde la raiz del repo (no desde backend/) porque el servicio
        # en Railway tiene configurado Root Directory = "backend": el CLI debe subir
        # el repo completo para que esa subcarpeta exista en el source subido.
        run: railway up --service ContainerTrack --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
