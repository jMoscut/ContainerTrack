name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "containertrack-frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "containertrack-frontend/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: containertrack-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: containertrack-frontend/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
        # Si hay errores de tipos -> falla -> no despliega

      - name: Lint (informativo, no bloquea)
        run: npm run lint
        continue-on-error: true

      - name: Ejecutar tests unitarios
        run: npm run test
        # Si algun test falla -> no despliega (Gate 2)

      - name: Build de produccion
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_PROD }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL_PROD }}

      - name: Subir build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: containertrack-frontend/dist/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: containertrack-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: containertrack-frontend/package-lock.json

      - run: npm ci

      - name: Build de produccion
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_PROD }}

      - name: Deploy a Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: containertrack
          directory: containertrack-frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
