spring:
  application:
    name: containertrack
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 210MB

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:no-reply@containertrack.gt}
  sender-name: ${BREVO_SENDER_NAME:ContainerTrack}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  refresh-expiration-ms: ${REFRESH_EXPIRATION_MS:604800000}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

r2:
  account-id: ${R2_ACCOUNT_ID:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket-name: ${R2_BUCKET_NAME:}
  endpoint: ${R2_ENDPOINT:}

management:
  endpoints:
    web:
      exposure:
        include: health
